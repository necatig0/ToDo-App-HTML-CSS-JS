<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        Student List
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="input-group">
                                <input type="text" id="student-name" class="form-control" placeholder="Student Name">
                                <input type="number" id="student-age" class="form-control" placeholder="Age">
                                <button type="submit" class="btn btn-primary" id="addNewStudent">
                                    Add
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header controls">
                        <div class="btn-group" role="group">
                            <input id="all" type="radio" class="btn-check active" name="btnradio" autocomplete="off" checked>
                            <label class="btn btn-outline-primary" for="all">All</label>

                            <input id="under" type="radio" class="btn-check" name="btnradio" autocomplete="off">
                            <label class="btn btn-outline-primary" for="under">Under 18</label>

                            <input id="above" type="radio" class="btn-check" name="btnradio" autocomplete="off">
                            <label class="btn btn-outline-primary" for="above">18+</label>
                        </div>
                        <button id="deleteAllStudents" class="btn btn-danger btn-sm float-end">Delete</button>
                    </div>

                    <ul id="student-list" class="list-group list-group-flush">
                       
                    </ul>

                    <div class="student-info card-footer">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        "use strict"

        let studentList = [];
        let studentCounter = 0;
        let editMode = false, editSId = null;
        let ageFilter = "all";

        const studentAddButton = document.querySelector("#addNewStudent");
        const studentNameInput = document.querySelector("#student-name");
        const studentAgeInput = document.querySelector("#student-age");
        const deleteAll = document.querySelector("#deleteAllStudents");
        const ageFilters = document.querySelectorAll(".controls input")
        

        studentAddButton.addEventListener("click", addStudent);
        deleteAll.addEventListener("click", deleteAllStudents);

        if(localStorage.getItem("studentList") !== null) {
            studentList = JSON.parse(localStorage.getItem("studentList"));
        }

        displayAllStudents(ageFilter); // When website is opened for the first time!!!

        function addStudent(e) {

            e.preventDefault();

            let nameInputValue = studentNameInput.value.trim();
            let ageInputValue = studentAgeInput.value;

            if (nameInputValue === "" || ageInputValue === "" || ageInputValue >= 50 || ageInputValue <= 0) {
                alert("Please Enter Valid Name/Age");
                return;
            }

            if(!editMode){ 
                studentCounter++;
                studentList.push({ "id": studentCounter, "name": nameInputValue, "age": Number(ageInputValue) });
            } else {
                for(let s of studentList) {
                    if (s.id === editSId) {
                        s.name = studentNameInput.value;
                        s.age = studentAgeInput.value;
                        break;
                    }
                }
                editMode = false; editSId = null;
            }

            studentNameInput.value = "";
            studentAgeInput.value = "";

            displayAllStudents(ageFilter);
            localStorage.setItem("studentList", JSON.stringify(studentList));
        }

        function displayAllStudents(filter) {
            let ul = document.querySelector("#student-list");
            ul.innerHTML = "";

            if (studentList.length === 0) {
                ul.innerHTML = "<p class=p-3 m-0>There is no student.</p>";
                document.querySelector(".student-info").innerHTML = "";
                return;
            }

            for (let student of studentList) {

                if(filter === "all" || (filter === "above" && student.age >= 18) || (filter === "under" && student.age <18)) {

                    let li = `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>
                            ${student.name} - ${student.age}
                        </span>

                        <div class="btn-group">
                        <button type="button" class="btn dropdown-toggle btn-sm" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-caret-down"></i>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a onclick = "deleteSingleStudent(${student.id}, event)" class="dropdown-item" href="#"><i class="fa-solid fa-xmark"></i></a></li>
                            <li><a onclick = "updateStudent(${student.id}, '${student.name}', ${student.age})" class="dropdown-item" href="#"><i class="fa-solid fa-user-pen"></i></a></li>
                        </ul>
                    </li>
                    
                `;

                ul.insertAdjacentHTML("beforeend", li);
                }

                
            }

            let adultCount = 0, minorCount = 0;

            for(let s of studentList) {
                if(s.age >= 18) adultCount++;
                else minorCount++;
            }

            document.querySelector(".student-info").innerHTML = `
                <p>
                    Total: ${studentList.length}
                    <br>
                    Adults: ${adultCount}
                    <br>
                    Minors: ${minorCount}
                 </p>
            `;
        }

        function deleteSingleStudent(student, event) {
            event.preventDefault();
            let sIdx;

            for(let s in studentList) {
                if(studentList[s].id === student) {
                    sIdx = s;
                    break;
                }
            }

            studentList.splice(sIdx, 1);

            displayAllStudents(ageFilter);
            localStorage.setItem("studentList", JSON.stringify(studentList));
        }

        function deleteAllStudents() {
            studentList.splice(0, studentList.length);
            studentCounter = 0;

            displayAllStudents(ageFilter);
            localStorage.setItem("studentList", JSON.stringify(studentList));
        }

        function updateStudent (id, name, age) {

            editMode = true;
            editSId = id;

            studentAgeInput.value = age;
            studentNameInput.value = name;
            studentNameInput.focus();
        }

        const parentOfLi = document.querySelector("#student-list");
        parentOfLi.addEventListener("click", selectStudent);

        function selectStudent(e) {
            let targetLi = e.target.closest("li");
            const liS = parentOfLi.querySelectorAll(".list-group-item");

            if(targetLi.classList.contains("active")) {
                targetLi.classList.remove("active");
                return;
            }

            for(let li of liS) {
                li.classList.remove("active");
            }

            targetLi.classList.add("active");
            localStorage.setItem("studentList", JSON.stringify(studentList));
        }

        for(let input of ageFilters) {
            input.addEventListener("click", function () {
                ageFilter = input.id;
                displayAllStudents(ageFilter);
            })
            
            }


    </script>


</body>

</html>
